name: Guncel Portfoy Analizini Onbellekle

on:
  schedule:
    # Pazartesi - Cuma 18:30 TSI (15:30 UTC)
    - cron: '30 15 * * 1-5'
  workflow_dispatch: # İhtiyaç anında elle çalıştırmak için

jobs:
  cache_report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install requests pyyaml yfinance pandas

      - name: Portföy API yapılandırmasını doğrula
        env:
          PORTFOLIO_API_TOKEN: ${{ secrets.PORTFOLIO_API_TOKEN }}
          PORTFOLIO_API_URL: ${{ vars.PORTFOLIO_API_URL }}
        run: |
          test -n "$PORTFOLIO_API_TOKEN"
          test -n "$PORTFOLIO_API_URL"

      - name: Analizi Yap ve KV'ye Yaz
        env:
          PORTFOLIO_API_TOKEN: ${{ secrets.PORTFOLIO_API_TOKEN }}
          PORTFOLIO_API_URL: ${{ vars.PORTFOLIO_API_URL }}
        run: python cache_reporter.py